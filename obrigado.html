<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Obrigado pela confirmação!</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f9f7f4;
      --card: #ffffff;
      --ink: #2b2b2b;
      --muted: #6b7280;
      --accent: #9b6b6b;
      --accent-2: #c59a9a;
      --ring: rgba(155,107,107,.25);
      --radius: 18px;
    }
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      color: var(--ink);
      padding: 20px;
      overflow-x: hidden;
    }
    .card {
      background: var(--card);
      padding: 40px 30px;
      border-radius: var(--radius);
      box-shadow: 0 8px 28px rgba(0,0,0,.1);
      max-width: 480px;
      width: 100%;
      animation: fadeIn 0.8s ease;
      position: relative;
      z-index: 2;
    }
    h1 {
      font-family: "Playfair Display", serif;
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 16px;
    }
    p {
      font-size: 1rem;
      margin-bottom: 24px;
      color: var(--muted);
    }
    .btn {
      display: inline-block;
      padding: 12px 20px;
      background: var(--accent);
      color: #fff;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: background .2s ease;
    }
    .btn:hover {
      background: var(--accent-2);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* canvas para os confetes */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <div class="card">
    <h1>Obrigado! 💖</h1>
    <p>Sua presença foi registrada com carinho.<br>
    Estamos ansiosos para celebrar esse momento especial ao seu lado!</p>
    <a href="index.html" class="btn">Voltar ao convite</a>
  </div>

  <!-- Script de confete -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const duration = 4 * 1000; // 4 segundos de confete
    const animationEnd = Date.now() + duration;
    const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

    function randomInRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    (function frame() {
      const timeLeft = animationEnd - Date.now();

      if (timeLeft <= 0) return;

      const particleCount = 50 * (timeLeft / duration);
      confetti(Object.assign({}, defaults, {
        particleCount,
        origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
      }));
      confetti(Object.assign({}, defaults, {
        particleCount,
        origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
      }));

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
